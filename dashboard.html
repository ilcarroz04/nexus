<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexus Wall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0C0B12">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: schermo unico orizzontale, niente scroll. Testata | evento in arrivo (grande) · prossimi · calendario+to do | striscia weekend + compensi */
:root{
  --bg:#0C0B12; --panel:#13121b; --panel2:#1a1824; --line:#25222f;
  --fg:#F4F2FA; --muted:#8f8aa3; --dim:#5d586f; --brand:#A77BFF;
  --cyan:#3ff0ff; --magenta:#ff3fb4; --amber:#ffb23f; --violet:#9a7bff; --lime:#8dff6a; --red:#ff5a5a;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:1.1rem;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{font-size:clamp(11px,min(1.18vw,1.95vh),30px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased;cursor:none}
[hidden]{display:none!important}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1rem;
  padding-block:1.1rem;padding-left:max(1.4rem,env(safe-area-inset-left,0px));padding-right:max(1.4rem,env(safe-area-inset-right,0px));
  transition:transform 2s ease}
.label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;min-width:0;min-height:0;display:flex;flex-direction:column;gap:.8rem;overflow:hidden;position:relative}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:.8rem}
.ph h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.02rem;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

/* testata */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem}
.brand{display:flex;align-items:baseline;font-family:var(--f-display);font-weight:900;font-size:2rem;line-height:1;letter-spacing:-.01em}
.brand svg{width:.77em;height:.83em;flex:none}
.brandsub{margin-top:.35rem}
.clock{text-align:center}
.clock .t{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1;letter-spacing:.02em}
.clock .t span{color:var(--brand);animation:blink 2s steps(1) infinite}
.clock .d{margin-top:.35rem;font-size:.95rem;font-weight:600;color:var(--muted);text-transform:capitalize}
.sync{justify-self:end;display:flex;align-items:center;gap:.55rem;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-align:right}
.sync i{width:.6rem;height:.6rem;border-radius:50%;background:var(--lime);box-shadow:0 0 .6rem var(--lime)}
.sync.off i{background:var(--amber);box-shadow:0 0 .6rem var(--amber)}
.sync.demo i{background:var(--brand);box-shadow:0 0 .6rem var(--brand)}
@keyframes blink{50%{opacity:.25}}

/* corpo */
main{display:grid;grid-template-columns:1.32fr 1fr 1fr;gap:1rem;min-height:0}
.col{display:grid;gap:1rem;min-height:0}
.col.right{grid-template-rows:minmax(0,1.15fr) minmax(0,1fr)}

/* evento in arrivo */
.hero{padding:1.5rem 1.6rem;gap:0;justify-content:space-between;background:radial-gradient(120% 80% at 50% -10%,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%),var(--panel)}
.beams{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.beams b{position:absolute;top:-6%;width:46%;height:120%;opacity:.16;
  background:linear-gradient(180deg,var(--c),transparent 85%);filter:blur(1.4rem);transform-origin:50% 0;animation:sweep 14s ease-in-out infinite}
.beams b:first-child{left:4%;clip-path:polygon(38% 0,62% 0,100% 100%,40% 100%);}
.beams b:last-child{right:4%;clip-path:polygon(38% 0,62% 0,60% 100%,0 100%);animation-delay:-7s}
@keyframes sweep{0%,100%{opacity:.10;transform:rotate(-3deg)}50%{opacity:.22;transform:rotate(3deg)}}
.hero > :not(.beams){position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.eyebrow{display:flex;align-items:center;gap:.6rem;color:var(--c)}
.eyebrow::before{content:"";width:1.4rem;height:2px;background:var(--c);box-shadow:0 0 .5rem var(--c)}
.chip{display:inline-flex;align-items:center;gap:.45rem;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .7rem;border-radius:99px;
  border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);white-space:nowrap}
.chip::before{content:"";width:.5rem;height:.5rem;border-radius:50%;background:var(--c);box-shadow:0 0 .45rem var(--c)}
.pill{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;padding:.3rem .6rem;border-radius:99px;background:var(--panel2);white-space:nowrap}
.pill.ok{color:var(--lime)}.pill.opz{color:var(--amber);border:1px dashed color-mix(in srgb,var(--amber) 60%,transparent)}
.when{display:flex;align-items:flex-end;gap:1.4rem;margin-top:1.2rem}
.big{font-family:var(--f-display);font-weight:900;font-size:7.4rem;line-height:.82;letter-spacing:-.03em}
.when .md{display:flex;flex-direction:column;gap:.35rem;padding-bottom:.3rem}
.when .dow{font-family:var(--f-mono);font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.when .mon{font-family:var(--f-display);font-weight:700;font-size:1.7rem;text-transform:uppercase;line-height:1}
.count{margin-left:auto;text-align:right;padding-bottom:.2rem}
.count .n{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:.9;color:var(--c);text-shadow:0 0 1.6rem color-mix(in srgb,var(--c) 70%,transparent)}
.count .u{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:.4rem}
.title{font-family:var(--f-display);font-weight:700;font-size:2.05rem;line-height:1.08;margin:1.2rem 0 .3rem;text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.place{font-size:1.15rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.place svg{width:1.05rem;height:1.05rem;stroke:var(--c);fill:none;stroke-width:2;flex:none}
.place b{color:var(--fg)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-top:1.2rem}
.tb{border:1px solid var(--line);border-radius:.8rem;padding:.7rem .85rem;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.tb .v{font-family:var(--f-display);font-weight:700;font-size:1.55rem;margin-top:.35rem;font-variant-numeric:tabular-nums}
.tb.na .v{color:var(--dim)}
.tb.past{opacity:.4}
.tb.next{border-color:var(--c);box-shadow:0 0 1.2rem -.5rem var(--c) inset,0 0 1rem -.6rem var(--c)}
.tb.next .label{color:var(--c)}
.crew{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:1.1rem}
.avs{display:flex;gap:.5rem;flex-wrap:wrap;min-width:0}
.av{display:flex;align-items:center;gap:.5rem;padding:.3rem .75rem .3rem .3rem;border-radius:99px;background:var(--panel2);font-weight:700;font-size:.85rem}
.av i{font-style:normal;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;background:color-mix(in srgb,var(--brand) 25%,var(--panel));color:var(--brand)}
.client{font-size:.85rem;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client b{color:var(--fg)}
.empty{flex:1;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:1rem;line-height:1.5;border:1px dashed var(--line);border-radius:.9rem;padding:1rem}
.empty strong{display:block;font-family:var(--f-display);color:var(--fg);font-size:1.4rem;margin-bottom:.3rem}

/* prossimi */
.list{display:flex;flex-direction:column;gap:.55rem;min-height:0;overflow:hidden;-webkit-mask:linear-gradient(#000 85%,transparent);mask:linear-gradient(#000 85%,transparent)}
.row{display:grid;grid-template-columns:3.3rem minmax(0,1fr) auto;gap:.9rem;align-items:center;padding:.7rem .8rem;border-radius:.85rem;background:var(--panel2);border-left:3px solid var(--c)}
.row.opz{background:repeating-linear-gradient(135deg,var(--panel2) 0 .6rem,color-mix(in srgb,var(--amber) 5%,var(--panel2)) .6rem 1.2rem)}
.rd{text-align:center}
.rd .d{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1;color:var(--c)}
.rd .m{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.25rem}
.row .t{font-weight:800;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);margin-top:.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);line-height:1.5;font-variant-numeric:tabular-nums}
.row .r b{color:var(--fg);font-weight:600}

/* calendario */
.cal{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto;grid-auto-rows:minmax(0,1fr);gap:.3rem;min-height:0}
.dw{font-family:var(--f-mono);font-size:.58rem;text-align:center;color:var(--muted);letter-spacing:.1em;padding-bottom:.15rem}
.dw.we{color:var(--brand)}
.cd{border-radius:.5rem;display:flex;align-items:center;justify-content:center;position:relative;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums;background:var(--panel2);min-height:0}
.cd.out{opacity:.18}
.cd.we{background:color-mix(in srgb,var(--brand) 9%,var(--panel2))}
.cd.past{color:var(--dim)}
.cd.busy{background:color-mix(in srgb,var(--c) 26%,var(--panel2));color:var(--fg);box-shadow:0 0 .8rem -.3rem var(--c);outline:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.cd.busy.past{opacity:.5}
.cd.today{outline:2px solid var(--fg);outline-offset:-2px}
.cd .n2{position:absolute;top:.15rem;right:.25rem;font-size:.5rem;font-family:var(--f-mono);color:var(--fg)}

/* to do */
.todo{display:flex;flex-direction:column;gap:.5rem;min-height:0;overflow:hidden;-webkit-mask:linear-gradient(#000 82%,transparent);mask:linear-gradient(#000 82%,transparent)}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.65rem;font-size:.88rem}
.task .box{width:1rem;height:1rem;border-radius:.3rem;border:2px solid var(--muted)}
.task.late .box{border-color:var(--red)}
.task.late .due{color:var(--red)}
.task .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.task .tt small{display:block;color:var(--muted);font-weight:500;font-size:.72rem}
.task .due{font-family:var(--f-mono);font-size:.7rem;color:var(--amber);white-space:nowrap}
.projs{display:flex;flex-direction:column;gap:.55rem;margin-top:auto;padding-top:.6rem;border-top:1px solid var(--line)}
.pj{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;font-size:.78rem}
.pj span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pj em{font-style:normal;font-family:var(--f-mono);color:var(--muted);font-size:.7rem}
.bar{grid-column:1/-1;height:.28rem;border-radius:1rem;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 60%,var(--bg)),var(--brand));box-shadow:0 0 .6rem var(--brand)}

/* striscia in basso */
footer{display:grid;grid-template-columns:2.32fr 1fr;gap:1rem}
.wks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.6rem;flex:1}
.wk{border-radius:.8rem;padding:.65rem .75rem;background:var(--panel2);display:flex;flex-direction:column;gap:.3rem;min-width:0;border:1px solid transparent}
.wk .dd{font-family:var(--f-display);font-weight:700;font-size:1rem;white-space:nowrap}
.wk .st{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.wk .ev{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk.free .st{color:var(--lime)}
.wk.full{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,var(--panel2))}
.wk.full .st{color:var(--c)}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;flex:1}
.mc{display:flex;flex-direction:column;justify-content:center;gap:.3rem;min-width:0}
.mc .v{font-family:var(--f-display);font-weight:800;font-size:1.65rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc.main .v{color:var(--lime);text-shadow:0 0 1.1rem color-mix(in srgb,var(--lime) 40%,transparent)}
.mc .h{font-size:.72rem;color:var(--muted)}

/* accesso */
.login{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:1.5rem;cursor:auto}
.login form{width:min(26rem,100%);display:flex;flex-direction:column;gap:.9rem}
.login h1{margin:0 0 .3rem;font-family:var(--f-display);font-size:1.4rem}
.login p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
.login input{font:inherit;font-size:1rem;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.9rem}
.login input:focus,.login button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.login button{font-family:var(--f-display);font-weight:700;font-size:.95rem;border:0;border-radius:.8rem;padding:1rem;background:var(--brand);color:var(--bg);cursor:pointer}
.login .err{color:var(--red);font-size:.85rem;min-height:1.2em}

.night{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 4s;z-index:40}

/* tablet in verticale: si impila e scorre */
@media (orientation:portrait){
  html{font-size:clamp(11px,2.3vw,26px)}
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  main{grid-template-columns:1fr}
  .col.right{grid-template-rows:auto auto}
  .cal{aspect-ratio:7/5.4}
  footer{grid-template-columns:1fr}
  .wks{grid-template-columns:repeat(3,minmax(0,1fr))}
  .list,.todo{-webkit-mask:none;mask:none}
}
@media (prefers-reduced-motion:reduce){.beams b,.clock .t span{animation:none}.app{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div>
      <div class="brand" role="img" aria-label="NEXUS">NE<svg viewBox="0 0 100 108" aria-hidden="true"><defs><linearGradient id="hb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A77BFF"/><stop offset="1" stop-color="#A77BFF" stop-opacity=".45"/></linearGradient></defs><polygon points="11,10 23,10 100,108 66,108" fill="url(#hb)"/><polygon points="77,10 89,10 34,108 0,108" fill="url(#hb)"/><rect x="6" y="0" width="22" height="10" rx="2" fill="#F4F2FA"/><rect x="72" y="0" width="22" height="10" rx="2" fill="#F4F2FA"/></svg>US</div>
      <div class="label brandsub">Events · Ufficio</div>
    </div>
    <div class="clock"><div class="t num" id="clock">--<span>:</span>--</div><div class="d" id="date"></div></div>
    <div class="sync" id="sync"><div id="syncTxt">Connessione…</div><i></i></div>
  </header>

  <main>
    <section class="panel hero" id="hero" style="--c:var(--brand)"></section>
    <section class="panel">
      <div class="ph"><h2>In arrivo</h2><span class="label num" id="upCount"></span></div>
      <div class="list" id="list"></div>
    </section>
    <div class="col right">
      <section class="panel">
        <div class="ph"><h2 id="calTitle"></h2><span class="label" id="calInfo"></span></div>
        <div class="cal" id="cal"></div>
      </section>
      <section class="panel">
        <div class="ph"><h2>Da fare</h2><span class="label">prossimi 7 giorni</span></div>
        <div class="todo" id="todo"></div>
        <div class="projs" id="projs"></div>
      </section>
    </div>
  </main>

  <footer>
    <section class="panel" style="padding-block:.9rem">
      <div class="ph"><h2>Weekend</h2><span class="label">sabato e domenica · prossime 6 settimane</span></div>
      <div class="wks" id="wks"></div>
    </section>
    <section class="panel" id="moneyPanel" style="padding-block:.9rem">
      <div class="ph"><h2>Compensi</h2><span class="label">eventi eseguiti</span></div>
      <div class="money" id="money"></div>
    </section>
  </footer>
</div>

<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1>Collega il tablet</h1>
    <p>Accedi una volta con un account dello staff. Il tablet resta collegato e la dashboard si aggiorna da sola.</p>
    <input id="li-email" type="email" placeholder="Email" required autocomplete="username">
    <input id="li-pass" type="password" placeholder="Password" required autocomplete="current-password">
    <div class="err" id="li-err"></div>
    <button type="submit" id="li-btn">Accedi</button>
  </form>
</div>
<div class="night" id="night"></div>

<script>
/* ===== Impostazioni (si cambiano anche dall'indirizzo: dashboard.html?soldi=0&notte=23-7) ===== */
const P=new URLSearchParams(location.search);
const SHOW_MONEY=P.get("soldi")!=="0";
const NIGHT=(P.get("notte")||"0-7").split("-").map(Number); // ore in cui lo schermo si abbassa; "notte=off" per disattivare
const NIGHT_ON=P.get("notte")!=="off";
const DEMO=P.has("demo")||!/github\.io$|^localhost$/.test(location.hostname);

const CATS={
 audio:{name:"Service audio",c:"var(--cyan)"},
 luci:{name:"Service luci",c:"var(--magenta)"},
 audioluci:{name:"Service audio luci",c:"var(--violet)"},
 tecnici:{name:"Tecnici luci",c:"var(--amber)"},
 ld:{name:"Light designer",c:"var(--lime)"},
 manov:{name:"Manovalanza",c:"var(--red)"}};
const cat=id=>CATS[id]||CATS.audio;
const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const GG=["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const eur=v=>(+v||0).toLocaleString("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const initials=n=>String(n).split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const mins=t=>{if(!t)return null;const[h,m]=t.split(":").map(Number);return h*60+m};
let NOW=new Date(),TODAY;
const daysTo=s=>Math.round((parse(s)-TODAY)/864e5);

let S={events:[],projects:[],staff:[]};

/* Dati di esempio: solo in anteprima (fuori da GitHub Pages) */
function demoData(){
  const t=new Date();t.setHours(0,0,0,0);
  const d=n=>{const x=new Date(t);x.setDate(x.getDate()+n);return iso(x)};
  const nextSat=(6-t.getDay()+7)%7||7;
  return {events:[
    {id:"d1",title:"Esempio · Festa aziendale",cat:"audioluci",date:d(2),dep:"08:30",loadin:"10:00",show:"20:30",place:"Verona, Fiera",client:"Cliente esempio",status:"ok",staff:["Alessandro","Davide"],pay:900},
    {id:"d2",title:"Esempio · Concerto in piazza",cat:"ld",date:d(nextSat),dep:"12:00",loadin:"14:00",show:"21:00",place:"Parma",client:"Service partner",status:"ok",staff:["Alessandro"],pay:350},
    {id:"d3",title:"Esempio · Matrimonio",cat:"luci",date:d(nextSat+7),dep:"09:00",loadin:"",show:"",place:"Vigatto",client:"Privato",status:"opz",staff:["Davide"],pay:600},
    {id:"d4",title:"Esempio · Convention",cat:"audio",date:d(nextSat+11),dep:"07:00",loadin:"08:30",show:"10:00",place:"Bologna",client:"Agenzia",status:"ok",staff:["Alessandro","Davide"],pay:750},

/* ===== Disegno ===== */
const PIN='<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const valid=e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||"");

function renderClock(){
  const h=String(NOW.getHours()).padStart(2,"0"),m=String(NOW.getMinutes()).padStart(2,"0");
  $("#clock").innerHTML=`${h}<span>:</span>${m}`;
  $("#date").textContent=`${GG[NOW.getDay()]} ${NOW.getDate()} ${MESI[NOW.getMonth()]}`;
}

function renderHero(up){
  const el=$("#hero");
  if(!up.length){el.style.setProperty("--c","var(--brand)");
    el.innerHTML=`<div class="beams"><b></b><b></b></div><div class="eyebrow label">Prossimo evento</div><div class="empty"><div><strong>Calendario libero</strong>Nessun evento in programma. Quelli creati nell'app compaiono qui da soli.</div></div>`;return}
  const e=up[0],c=cat(e.cat),d=parse(e.date),n=daysTo(e.date);
  el.style.setProperty("--c",c.c);
  const nowM=NOW.getHours()*60+NOW.getMinutes();
  const T=[["Partenza",e.dep],["Load-in",e.loadin],["Show",e.show]];
  let nextIdx=-1;
  if(n===0){nextIdx=T.findIndex(([,v])=>v&&mins(v)>nowM)}
  else nextIdx=T.findIndex(([,v])=>v);
  let cnt;
  if(n===0){
    const nx=T[nextIdx];
    if(nx){const diff=mins(nx[1])-nowM;cnt=`<div class="n num">${diff>=60?Math.floor(diff/60)+"h"+String(diff%60).padStart(2,"0"):diff+"′"}</div><div class="u">a ${nx[0].toLowerCase()}</div>`}
    else cnt=`<div class="n">OGGI</div><div class="u">in corso</div>`;
  }else if(n===1)cnt=`<div class="n">DOMANI</div><div class="u">${e.dep?"partenza "+e.dep:"&nbsp;"}</div>`;
  else cnt=`<div class="n num">${n}</div><div class="u">giorni</div>`;
  el.innerHTML=`<div class="beams"><b></b><b></b></div>
   <div>
    <div class="hero-top"><div class="eyebrow label">${n===0?"Oggi si lavora":"Prossimo evento"}</div>
      <div style="display:flex;gap:.5rem;align-items:center"><span class="chip">${c.name}</span><span class="pill ${e.status==="opz"?"opz":"ok"}">${e.status==="opz"?"Opzionato":"Confermato"}</span></div></div>
    <div class="when"><div class="big num">${d.getDate()}</div><div class="md"><div class="dow">${GG[d.getDay()]}</div><div class="mon">${MESI[d.getMonth()]}</div></div><div class="count">${cnt}</div></div>
    <div class="title">${esc(e.title||"Evento")}</div>
    <div class="place">${PIN}<b>${esc(e.place||"Luogo da definire")}</b></div>
   </div>
   <div>
    <div class="times">${T.map(([l,v],i)=>`<div class="tb ${!v?"na":""} ${n===0&&v&&mins(v)<=nowM?"past":""} ${i===nextIdx?"next":""}"><div class="label">${l}</div><div class="v">${v||"—"}</div></div>`).join("")}</div>
    <div class="crew"><div class="avs">${(e.staff||[]).map(s=>`<span class="av"><i>${esc(initials(s))}</i>${esc(s)}</span>`).join("")||`<span class="label">Staff da assegnare</span>`}</div>
      ${e.client?`<div class="client">per <b>${esc(e.client)}</b></div>`:""}</div>
   </div>`;
}

function renderList(up){
  const rest=up.slice(1,9);
  $("#upCount").textContent=up.length?`${up.length} in programma`:"";
  $("#list").innerHTML=rest.map(e=>{const c=cat(e.cat),d=parse(e.date),n=daysTo(e.date);
    return `<div class="row ${e.status==="opz"?"opz":""}" style="--c:${c.c}">
      <div class="rd"><div class="d num">${d.getDate()}</div><div class="m">${MESI[d.getMonth()].slice(0,3)} · ${GG[d.getDay()].slice(0,3)}</div></div>
      <div style="min-width:0"><div class="t">${esc(e.title)}</div><div class="s">${esc(e.place||"—")} · ${c.name}${e.status==="opz"?" · opzionato":""}</div></div>
      <div class="r">${e.dep?`<b>${e.dep}</b><br>`:""}${n===1?"domani":"tra "+n+" gg"}</div></div>`}).join("")
   ||`<div class="empty"><div>${up.length?"Dopo il prossimo, nessun altro evento in calendario.":"Niente in arrivo."}</div></div>`;
}

function renderCal(ev){
  const m0=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);
  $("#calTitle").textContent=MESI[m0.getMonth()][0].toUpperCase()+MESI[m0.getMonth()].slice(1)+" "+m0.getFullYear();
  const start=new Date(m0);start.setDate(1-((m0.getDay()+6)%7));
  let h=["lun","mar","mer","gio","ven","sab","dom"].map((x,i)=>`<div class="dw ${i>4?"we":""}">${x}</div>`).join("");
  let busy=0;const weeks=Math.ceil((((m0.getDay()+6)%7)+new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate())/7);
  for(let i=0;i<weeks*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);
    const k=iso(d),evs=ev.filter(e=>e.date===k),we=d.getDay()%6===0,inM=d.getMonth()===m0.getMonth();
    if(evs.length&&inM)busy++;
    h+=`<div class="cd ${inM?"":"out"} ${we?"we":""} ${d<TODAY?"past":""} ${k===iso(TODAY)?"today":""} ${evs.length?"busy":""}" ${evs.length?`style="--c:${cat(evs[0].cat).c}"`:""}>${d.getDate()}${evs.length>1?`<span class="n2">×${evs.length}</span>`:""}</div>`}
  $("#cal").innerHTML=h;
  $("#calInfo").textContent=busy?`${busy} ${busy===1?"giorno":"giorni"} occupati`:"mese libero";
}

function renderTodo(){
  const lim=new Date(TODAY);lim.setDate(lim.getDate()+7);
  const ts=[];(S.projects||[]).forEach(p=>(p.tasks||[]).forEach(t=>{if(!t.d&&t.due&&parse(t.due)<=lim)ts.push({...t,p:p.name})}));
  ts.sort((a,b)=>a.due.localeCompare(b.due));
  $("#todo").innerHTML=ts.map(t=>{const n=daysTo(t.due),late=n<0;
    return `<div class="task ${late?"late":""}"><span class="box"></span><div class="tt">${esc(t.t)}<small>${esc(t.p)}</small></div>
      <span class="due">${late?"in ritardo":n===0?"oggi":n===1?"domani":parse(t.due).getDate()+" "+MESI[parse(t.due).getMonth()].slice(0,3)}</span></div>`}).join("")
   ||`<div class="label" style="padding:.4rem 0">Nessuna scadenza in settimana</div>`;
  const pj=(S.projects||[]).filter(p=>(p.tasks||[]).length&&p.tasks.some(t=>!t.d)).slice(0,3);
  $("#projs").innerHTML=pj.map(p=>{const dn=p.tasks.filter(t=>t.d).length;
    return `<div class="pj"><span>${esc(p.name)}</span><em class="num">${dn}/${p.tasks.length}</em><div class="bar"><i style="width:${dn/p.tasks.length*100}%"></i></div></div>`}).join("");
  $("#projs").hidden=!pj.length;
}

function renderWeekends(ev){
  const sat=new Date(TODAY);sat.setDate(sat.getDate()+((6-sat.getDay()+7)%7));
  if(TODAY.getDay()===0)sat.setDate(sat.getDate()-1); // di domenica mostra ancora il weekend in corso
  let h="";
  for(let w=0;w<6;w++){const a=new Date(sat);a.setDate(sat.getDate()+w*7);const b=new Date(a);b.setDate(a.getDate()+1);
    const evs=ev.filter(e=>e.date===iso(a)||e.date===iso(b));
    const lbl=a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MESI[a.getMonth()].slice(0,3)}`:`${a.getDate()} ${MESI[a.getMonth()].slice(0,3)}–${b.getDate()} ${MESI[b.getMonth()].slice(0,3)}`;
    h+=evs.length
     ?`<div class="wk full" style="--c:${cat(evs[0].cat).c}"><div class="dd num">${lbl}</div><div class="st">${evs.some(e=>e.status!=="opz")?"Occupato":"Opzionato"}${evs.length>1?" · "+evs.length:""}</div><div class="ev">${esc(evs.map(e=>e.place||e.title).join(" · "))}</div></div>`
     :`<div class="wk free"><div class="dd num">${lbl}</div><div class="st">Libero</div><div class="ev">&nbsp;</div></div>`}
  $("#wks").innerHTML=h;
}

function renderMoney(ev,up){
  $("#moneyPanel").hidden=!SHOW_MONEY;
  $("footer").style.gridTemplateColumns=SHOW_MONEY?"":"1fr";
  if(!SHOW_MONEY)return;
  const done=ev.filter(e=>daysTo(e.date)<0),sum=a=>a.reduce((t,e)=>t+(+e.pay||0),0);
  const mon=done.filter(e=>{const d=parse(e.date);return d.getMonth()===TODAY.getMonth()&&d.getFullYear()===TODAY.getFullYear()});
  const yr=done.filter(e=>parse(e.date).getFullYear()===TODAY.getFullYear());
  $("#money").innerHTML=`<div class="mc main"><div class="label">${MESI[TODAY.getMonth()]}</div><div class="v">${eur(sum(mon))}</div><div class="h">${mon.length} eseguiti</div></div>
   <div class="mc"><div class="label">Anno ${TODAY.getFullYear()}</div><div class="v">${eur(sum(yr))}</div><div class="h">in programma ${eur(sum(up))}</div></div>`;
}

function renderAll(){
  NOW=new Date();TODAY=new Date(NOW);TODAY.setHours(0,0,0,0);
  const ev=(S.events||[]).filter(valid);
  const up=ev.filter(e=>daysTo(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date)||(a.dep||"").localeCompare(b.dep||""));
  renderClock();renderHero(up);renderList(up);renderCal(ev);renderTodo();renderWeekends(ev);renderMoney(ev,up);
  if(NIGHT_ON){const h=NOW.getHours(),[a,b]=NIGHT;const night=a<b?(h>=a&&h<b):(h>=a||h<b);$("#night").style.opacity=night?".72":"0"}
}

function setSync(state,txt){const s=$("#sync");s.className="sync "+(state||"");$("#syncTxt").textContent=txt}

/* Aggiornamento: orologio ogni secondo al cambio minuto, piccolo spostamento anti-stampaggio, ricarica alle 4 */
let lastMin=-1;
setInterval(()=>{const n=new Date();if(n.getMinutes()!==lastMin){lastMin=n.getMinutes();renderAll();
  if(n.getMinutes()%10===0){const x=(Math.random()*4-2).toFixed(1),y=(Math.random()*4-2).toFixed(1);$("#app").style.transform=`translate(${x}px,${y}px)`}
  if(n.getHours()===4&&n.getMinutes()===0&&navigator.onLine)location.reload()}},1000);
addEventListener("online",()=>renderAll());

if(DEMO){S=demoData();setSync("demo","Anteprima · dati di esempio");renderAll()}
else{renderAll();setSync("off","Connessione…")}
</script>
